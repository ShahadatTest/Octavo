appId: app.octavo.reader
productName: Octavo
copyright: Copyright © 2026
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
extraResources:
  - LICENSE
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
  category: public.app-category.books
linux:
  target:
    - AppImage
  category: Office
  maintainer: octavo
  artifactName: ${productName}-${version}.${ext}
