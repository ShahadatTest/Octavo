appId: app.octavo.reader
productName: Octavo
copyright: Copyright © 2026 Andrew McKenzie
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
extraResources:
  - LICENSE
  - THIRD_PARTY_LICENSES.md
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
  category: public.app-category.books
appImage:
  # electron-builder writes --no-sandbox into the desktop entry by default. Its launcher already
  # adds it only where Chromium's sandbox cannot run (no unprivileged user namespaces).
  executableArgs: []
linux:
  target:
    - AppImage
  category: Office
  maintainer: octavo
  artifactName: ${productName}-${version}.${ext}
