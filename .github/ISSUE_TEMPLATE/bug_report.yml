name: Bug report
description: Something in Octavo doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If this is a security problem (a book that runs script, reaches the network or touches files outside the library), please don't post it here: see [SECURITY.md](https://github.com/mckenzie-andrew/Octavo/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Imported a folder with ...
        2. Opened ...
        Expected ..., but ...
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Book format
      options:
        - EPUB
        - PDF
        - Both
        - Not about a particular book
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Octavo version
      description: Shown at the bottom of Settings (Ctrl+,).
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux (AppImage)
        - Built from source
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, error messages, or where the book came from (publisher, store). Please don't attach books you don't have the right to share.
