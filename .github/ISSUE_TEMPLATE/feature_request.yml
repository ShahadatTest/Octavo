name: Feature idea
description: Something Octavo should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before writing one, check the [open ideas](https://github.com/mckenzie-andrew/Octavo/issues?q=is%3Aissue+is%3Aopen+label%3Aenhancement): a 👍 or your own use case on an existing issue helps more than a duplicate.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way? Describe the problem before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working, if you have an idea.
  - type: checkboxes
    id: principles
    attributes:
      label: Fits Octavo
      description: See [what Octavo is, and isn't](https://github.com/mckenzie-andrew/Octavo#what-octavo-is-and-isnt).
      options:
        - label: It works offline, without an account or a server.
          required: true
